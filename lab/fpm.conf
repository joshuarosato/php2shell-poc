[global]
error_log = /tmp/poctest/lab/fpm.log
daemonize = no
pid = /tmp/poctest/lab/fpm.pid

[www]
listen = 127.0.0.1:9013
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
php_admin_value[memory_limit] = 4M
php_admin_value[post_max_size] = 8M
php_admin_value[session.upload_progress.enabled] = 1
php_admin_value[fatal_error_backtraces] = 1
